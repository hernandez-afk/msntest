<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Atari — Game Hub</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: var(--bg-deep);
    }
    .hub-logo { width: clamp(110px, 20vw, 160px); filter: drop-shadow(0 0 10px var(--atari-red)) drop-shadow(0 0 24px rgba(224,30,43,.5)); }
    .hub-title { font-family: var(--font-vector); color: var(--atari-red); letter-spacing: .14em; font-size: clamp(28px, 7vw, 48px); text-shadow: 0 0 14px var(--atari-red); margin-top: -8px; }
    .hub-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; padding: 0 20px; }
    .game-card {
      width: 220px;
      border: 2px solid var(--grey-70);
      border-radius: 6px;
      padding: 18px;
      text-align: center;
      text-decoration: none;
      color: var(--ink);
      background: var(--grey-90);
      transition: border-color .15s;
    }
    .game-card:hover { border-color: var(--accent, var(--yellow)); }
    .game-card h2 { font-family: var(--font-vector); font-size: 18px; letter-spacing: .06em; margin: 10px 0 6px; }
    .game-card p { font-size: 10px; color: var(--ink-dim); line-height: 1.6; }
    .swatches { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
    .swatches span { width: 12px; height: 12px; display: inline-block; border-radius: 2px; }
  </style>
</head>
